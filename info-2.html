<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/2.4.18/css/AdminLTE.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/2.4.18/css/skins/skin-blue.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
    <style>
        body {
            font-family: 'Source Sans Pro', sans-serif;
        }
        .content-wrapper {
            min-height: calc(100vh - 100px);
            background-color: #ecf0f5;
            padding: 15px;
        }
        .content-header {
            padding: 15px 0;
        }
        .content-header h1 {
            font-size: 24px;
            margin: 0;
        }
        .breadcrumb {
            background: transparent;
            margin: 0;
            padding: 8px 0;
        }
        .box {
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .box-header {
            padding: 10px;
            border-bottom: 1px solid #f4f4f4;
        }
        .box-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .box-body {
            padding: 15px;
        }
        .box-footer {
            padding: 10px;
            background: #f9f9f9;
            text-align: center;
        }
        .form-horizontal .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: 600;
        }
        .select2-container .select2-selection--single {
            height: 34px;
            border: 1px solid #d2d6de;
            border-radius: 0;
        }
        .input-group .input-group-addon {
            border-radius: 0;
            border-color: #d2d6de;
            background-color: #fff;
        }
        .btn {
            border-radius: 3px;
            padding: 6px 12px;
        }
        .btn-success {
            background-color: #00a65a;
            border-color: #008d4c;
        }
        .btn-warning {
            background-color: #f39c12;
            border-color: #e08e0b;
        }
        .table {
            margin-bottom: 0;
        }
        .table th {
            background: #3c8dbc;
            color: #fff;
        }
        .table-bordered {
            border: 1px solid #f4f4f4;
        }
        .table-bordered > thead > tr > th,
        .table-bordered > tbody > tr > td {
            border: 1px solid #f4f4f4;
        }
        .control-sidebar-bg {
            background: #222d32;
            position: fixed;
            z-index: 1000;
            width: 230px;
            top: 0;
            bottom: 0;
            right: -230px;
        }
        @media (max-width: 767px) {
            .content-header h1 {
                font-size: 20px;
            }
            .box-footer .btn {
                margin-bottom: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body class="hold-transition skin-blue sidebar-mini">
<div class="wrapper">
    <div class="content-wrapper">
        <section class="content-header">
            <h1>Sales Report</h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
                <li class="active">Sales Report</li>
            </ol>
        </section>
        <section class="content">
            <div class="row">
                <div class="col-md-12">
                    <div class="box box-primary">
                        <div class="box-header with-border">
                            <h3 class="box-title">Please Enter Valid Information</h3>
                        </div>
                        <form class="form-horizontal">
                            <div class="box-body">
                                <div class="form-group">
                                    <label for="store_id" class="col-sm-2 control-label">Store</label>
                                    <div class="col-sm-3">
                                        <select class="form-control select2" id="store_id" name="store_id">
                                            <option value="">Select Store</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="warehouse_id" class="col-sm-2 control-label">Warehouse</label>
                                    <div class="col-sm-3">
                                        <select class="form-control select2" id="warehouse_id" name="warehouse_id">
                                            <option value="">All</option>
                                        </select>
                                    </div>
                                    <label for="item_type" class="col-sm-2 control-label">Item Type</label>
                                    <div class="col-sm-3">
                                        <select class="form-control select2" id="item_type" name="item_type">
                                            <option value="">-All-</option>
                                            <option value="Items">Items</option>
                                            <option value="Services">Services</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="category_id" class="col-sm-2 control-label">Category</label>
                                    <div class="col-sm-3">
                                        <select class="form-control select2" id="category_id" name="category_id">
                                            <option value="">-All-</option>
                                        </select>
                                    </div>
                                    <label for="item_id" class="col-sm-2 control-label">Item Name</label>
                                    <div class="col-sm-3">
                                        <select class="form-control select2" id="item_id" name="item_id">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="from_date" class="col-sm-2 control-label">From Date</label>
                                    <div class="col-sm-3">
                                        <div class="input-group date">
                                            <div class="input-group-addon">
                                                <i class="fa fa-calendar"></i>
                                            </div>
                                            <input type="text" class="form-control pull-right datepicker" id="from_date" name="from_date" value="20-07-2025">
                                        </div>
                                    </div>
                                    <label for="to_date" class="col-sm-2 control-label">To Date</label>
                                    <div class="col-sm-3">
                                        <div class="input-group date">
                                            <div class="input-group-addon">
                                                <i class="fa fa-calendar"></i>
                                            </div>
                                            <input type="text" class="form-control pull-right datepicker" id="to_date" name="to_date" value="20-07-2025">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="box-footer">
                                <div class="col-sm-8 col-sm-offset-2 text-center">
                                    <div class="col-md-3 col-md-offset-3">
                                        <button type="button" class="btn btn-block btn-success">Show</button>
                                    </div>
                                    <div class="col-sm-3">
                                        <a href="#">
                                            <button type="button" class="btn btn-block btn-warning">Close</button>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <section class="content">
            <div class="row">
                <div class="col-md-12">
                    <div class="box">
                        <div class="box-header">
                            <h3 class="box-title">Records Table</h3>
                            <button class="btn btn-primary pull-right">Export</button>
                        </div>
                        <div class="box-body table-responsive no-padding">
                            <table class="table table-bordered table-hover" id="report-data">
                                <thead>
                                    <tr class="bg-blue">
                                        <th>#</th>
                                        <th>Store Name</th>
                                        <th>Invoice No</th>
                                        <th>Sales Date</th>
                                        <th>Customer Name</th>
                                        <th>Item Name</th>
                                        <th>Category</th>
                                        <th>Quantity</th>
                                        <th>Unit Price</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody id="tbodyid"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="control-sidebar-bg"></div>
</div>
</body>
</html>
